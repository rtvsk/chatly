services:
  postgres:
    image: postgres:16
    container_name: chatly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatly
      POSTGRES_PASSWORD: chatly
      POSTGRES_DB: chatly
    ports:
      - "5432:5432"
    volumes:
      - chatly_postgres_data:/var/lib/postgresql/data
    networks:
      - chatly_network

  redis:
    image: redis:7
    container_name: chatly_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - chatly_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: chatly_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: chatly
      RABBITMQ_DEFAULT_PASS: chatly
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - chatly_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatly_network

  minio:
    image: quay.io/minio/minio
    container_name: chatly_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - chatly_minio_data:/data
    networks:
      - chatly_network

volumes:
  chatly_postgres_data:
  chatly_minio_data:
  chatly_rabbitmq_data:

networks:
  chatly_network:
    driver: bridge
